services:
  - type: web
    name: kamicode-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: CODE_RUNNER_MODE
        value: piston
      - key: PISTON_BASE_URL
        value: https://emkc.org/api/v2/piston
      - key: CORS_ORIGINS
        value: "*"
      - key: BYPASS_AUTH
        value: "false"
      - key: CONVEX_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
